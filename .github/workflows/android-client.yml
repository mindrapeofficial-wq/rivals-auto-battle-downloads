name: Build embedded RIVALS Android client

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-client.yml
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character commit SHA from the private game repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: false

env:
  # This full SHA pins the reviewed game source independently of future main changes.
  REVIEWED_SOURCE_COMMIT: 160b4d0ad7f5e185f306943b7d8b82e251d5a7d4
  VITE_API_URL: https://rivals-auto-battle.onrender.com
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build-unsigned:
    name: Build and inspect unsigned APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact private game commit
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || env.REVIEWED_SOURCE_COMMIT }}
          SOURCE_KEY_B64: ${{ secrets.RIVALS_SOURCE_KEY_B64 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::source_commit must be a full lowercase Git commit SHA.'
            exit 1
          }
          test -n "$SOURCE_KEY_B64" || {
            echo '::error::The existing RIVALS source deploy key is unavailable.'
            exit 1
          }
          umask 077
          source_key="$RUNNER_TEMP/rivals_source"
          trap 'rm -f "$source_key"' EXIT
          printf '%s' "$SOURCE_KEY_B64" | base64 -d > "$source_key"
          ssh-keygen -y -f "$source_key" >/dev/null
          git init game
          git -C game remote add origin git@github.com:mindrapeofficial-wq/rivals-auto-battle.git
          GIT_SSH_COMMAND="ssh -i $source_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git -C game fetch --no-tags --depth 1 origin "$SOURCE_COMMIT"
          git -C game checkout --detach FETCH_HEAD
          actual_commit="$(git -C game rev-parse HEAD)"
          test "$actual_commit" = "$SOURCE_COMMIT"
          printf 'commit=%s\n' "$actual_commit" >> "$GITHUB_OUTPUT"
          printf 'Source commit: %s\n' "$actual_commit"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android 36 build tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          printf '%s\n' y y y y y y y y y y | "$sdk_manager" --licenses >/dev/null
          "$sdk_manager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"

      - name: Install locked workspace dependencies
        working-directory: game
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile

      - name: Generate Prisma and compile the workspace and embedded client
        working-directory: game
        run: |
          set -euo pipefail
          pnpm --dir server exec prisma generate
          pnpm compile
          pnpm --filter @labrute/client compile
          pnpm --filter @labrute/client build

      - name: Copy the client into Android without a remote entry point
        working-directory: game
        run: |
          set -euo pipefail
          env -u AUTOBATTLE_ONLINE_URL pnpm --filter @labrute/client exec cap sync android
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          built = Path('client/build')
          native = Path('client/android/app/src/main/assets')
          packaged = native / 'public'
          config = json.loads((native / 'capacitor.config.json').read_text())
          require(config.get('appId') == 'com.rivals.autobattle', 'Unexpected application ID.')
          require('url' not in (config.get('server') or {}), 'Remote Capacitor server.url is forbidden.')
          require((packaged / 'index.html').is_file(), 'The embedded index.html is missing.')
          require((packaged / 'index.html').read_bytes() == (built / 'index.html').read_bytes(),
                  'Android does not contain the newly built client.')
          api_url = os.environ['VITE_API_URL'].encode()
          require(any(api_url in p.read_bytes() for p in (packaged / 'assets').glob('*.js')),
                  'The built client does not contain the configured remote API endpoint.')
          for required in ('sfx/sfx.mp3', 'sfx/background.mp3'):
              require((built / required).is_file(), f'Required audio is missing: {required}')
          audio = [p for p in built.rglob('*') if p.is_file()
                   and p.suffix.lower() in {'.mp3', '.wav', '.ogg', '.m4a', '.webm'}]
          require(bool(audio), 'No local audio assets were built.')
          for original in audio:
              relative = original.relative_to(built)
              copied = packaged / relative
              require(original.stat().st_size > 0 and copied.is_file(),
                      f'Local audio asset is missing or empty: {relative}')
              require(hashlib.sha256(original.read_bytes()).digest()
                      == hashlib.sha256(copied.read_bytes()).digest(),
                      f'Local audio asset was not copied correctly: {relative}')
          print(f'Embedded client verified; {len(audio)} audio files are bundled.')
          PY

      - name: Build unsigned release artifacts
        working-directory: game/client/android
        # No original Android signing key has been located or confirmed.
        # Never substitute a debug key, generate a new key, or publish this output.
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          env -u RIVALS_ANDROID_KEYSTORE \
              -u RIVALS_ANDROID_STORE_PASSWORD \
              -u RIVALS_ANDROID_KEY_ALIAS \
              -u RIVALS_ANDROID_KEY_PASSWORD \
            ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify and prepare the unsigned artifacts
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          apk='game/client/android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo '::error::The review-only APK unexpectedly has a signature.'
            exit 1
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import zipfile

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          output = Path(os.environ['RUNNER_TEMP']) / 'rivals-android-artifacts'
          output.mkdir()
          apk = Path('game/client/android/app/build/outputs/apk/release/app-release-unsigned.apk')
          aab = Path('game/client/android/app/build/outputs/bundle/release/app-release.aab')
          require(aab.is_file() and aab.stat().st_size > 0, 'The AAB is missing.')
          aapt = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/aapt'
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          match = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",
                            badging, re.MULTILINE)
          require(match is not None, 'Could not read the APK identity.')
          package, code, version = match.groups()
          require(package == 'com.rivals.autobattle', 'The APK package changed.')
          require(code.isdecimal() and int(code) > 1, 'versionCode must be greater than the published version 1.')
          audio_count = 0
          for path, prefix in ((apk, 'assets/'), (aab, 'base/assets/')):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  require(not any(n.upper().startswith('META-INF/')
                                  and n.upper().endswith(('.RSA', '.DSA', '.EC', '.SF'))
                                  for n in names), f'{path.name} unexpectedly contains a signing certificate.')
                  config = json.loads(archive.read(prefix + 'capacitor.config.json'))
                  require('url' not in (config.get('server') or {}), f'{path.name} contains a remote entry point.')
                  require(config.get('appId') == package, f'{path.name} has an unexpected app ID.')
                  require(prefix + 'public/index.html' in names, f'{path.name} has no embedded client.')
                  require(archive.read(prefix + 'public/sfx/sfx.mp3'), f'{path.name} has no local sound effects.')
                  require(archive.read(prefix + 'public/sfx/background.mp3'), f'{path.name} has no local background audio.')
                  audio_count = sum(n.startswith(prefix + 'public/')
                                    and Path(n).suffix.lower() in {'.mp3', '.wav', '.ogg', '.m4a', '.webm'}
                                    for n in names)
          shutil.copyfile(apk, output / 'RIVALS-Auto-Battle-Android-unsigned.apk')
          shutil.copyfile(aab, output / 'RIVALS-Auto-Battle-Play-unsigned.aab')
          info = {
              'source_commit': os.environ['SOURCE_COMMIT'],
              'package': package,
              'version_code': int(code),
              'version_name': version,
              'api_url': os.environ['VITE_API_URL'],
              'embedded_client': True,
              'local_audio_files': audio_count,
              'signing': 'unsigned',
              'installable': False,
              'required_original_certificate_sha256':
                  '8df93f5849713b8540aada30a33350c7a3fc403c68d5f20f0d47cdd1406567b3',
          }
          (output / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          (output / 'README.txt').write_text(
              'Review artifacts only. These APK/AAB files are unsigned and are not installable releases.\n'
              'A compatible update requires the original RIVALS signing key and the recorded certificate fingerprint.\n'
              'No GitHub Release, Windows installer, or update manifest has been changed.\n')
          (output / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n'
              for p in sorted(output.iterdir()) if p.is_file()))
          print(json.dumps(info, indent=2))
          PY

      - name: Upload unsigned review artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rivals-android-unsigned-${{ steps.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rivals-android-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
